name: Evently terms pre-merge checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/terms-calendar-day-enforcement]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Next.js production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build
